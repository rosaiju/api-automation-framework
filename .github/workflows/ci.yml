name: API Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1-5"   # Run every weekday at 8 AM UTC

jobs:
  test:
    name: Run API Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: pytest -m smoke -v --tb=short -n auto
        env:
          BASE_URL: https://dummyjson.com
          BREW_BASE_URL: https://api.openbrewerydb.org/v1

      - name: Run full test suite
        if: success() || failure()
        run: pytest -v --tb=short -n auto --junit-xml=test-results.xml
        env:
          BASE_URL: https://dummyjson.com
          BREW_BASE_URL: https://api.openbrewerydb.org/v1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 30
